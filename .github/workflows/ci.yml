name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and development dependencies
        run: make install

      - name: Check formatting, lint and types
        run: make format-check lint

      - name: Run hermetic tests (pytest)
        run: |
          # These modules/scripts make live arXiv/PDF requests or load the Sentence Transformers model.
          # Keep them available for explicit manual runs, outside the offline CI gate.
          pytest -q \
            --ignore=tests/integration/test_full_integration_live.py \
            --ignore=tests/integration/test_integration_real_query.py \
            --ignore=tests/integration/test_retriever_arxiv.py \
            --ignore=tests/integration/test_pdf_downloader.py \
            --ignore=tests/integration/test_pdf_parser.py \
            --ignore=tests/integration/test_embedder.py \
            --ignore=tests/contract/test_vector_validation.py \
            --ignore=scripts/download_pdf_test.py
